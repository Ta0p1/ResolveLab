name: checks
on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: resolvelab eval --seeds 42 73 101 --require-policy reference --output artifacts/ci-evaluation.json
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: evaluation-python-${{ matrix.python }}
          path: artifacts/ci-evaluation.json
