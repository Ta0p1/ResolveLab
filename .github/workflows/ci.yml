name: checks
on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: resolvelab eval --seeds 42 73 101 --require-policy reference --output artifacts/ci-evaluation.json
      - run: python examples/casedesk_quickstart.py
      - run: resolvelab casedesk run --episode test-test_conflict_rate-07 --model teacher
      - run: python examples/casedesk_env_loop.py
      - run: python examples/dialect_episode.py
      - run: python examples/durable_recovery.py
      - run: python -m build
      # The wheel has to work with no repository around it.
      - run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install -c constraints.txt dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/resolvelab" casedesk run --episode test-test_conflict_rate-07 --model teacher
          "$RUNNER_TEMP/wheel/bin/resolvelab" durable run --episode durable-crash_before_after-00
          "$RUNNER_TEMP/wheel/bin/python" -c "from resolvelab.casedesk.env import CaseDeskEnv; from resolvelab.providers import STUDY; assert CaseDeskEnv().specs and STUDY.is_file()"
      - run: python scripts/verify_experiment.py
      - run: python scripts/verify_http_study.py
      # Every hash is checked; replays are thinned for CI. Run without flags for the full audit.
      - run: python scripts/verify_casedesk_v2.py --dagger-every 20 --replay-every 10
      - run: python scripts/verify_dialect_transfer.py --dagger-every 20 --replay-every 10
      # An edit outside the study core must leave the source tests and every audit passing.
      - if: matrix.python == '3.13'
        run: |
          printf '\n# A maintenance edit.\n' | tee -a src/resolvelab/cli.py src/resolvelab/providers/base.py
          pytest tests/test_locked_source.py tests/test_audit_hashing.py -q
          python scripts/verify_http_study.py
          python scripts/verify_casedesk_v2.py --dagger-every 200 --replay-every 60
          python scripts/verify_dialect_transfer.py --dagger-every 200 --replay-every 60
      - uses: actions/upload-artifact@v7
        with:
          name: evaluation-python-${{ matrix.python }}
          path: artifacts/ci-evaluation.json

  training-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -c constraints.txt -r requirements-training.txt -e ".[dev]"
      - run: pytest tests/test_training_loss.py tests/test_http_grammar.py tests/test_dialect_grammar.py -q
