[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "resolvelab"
version = "0.4.0"
description = "Fault-injected tool environments with side-effect grading for evaluating and post-training LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Allen Huang" }]
keywords = ["llm-agents", "tool-use", "agent-evaluation", "fault-injection", "dagger", "post-training"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
resolvelab = "resolvelab.cli:main"

[project.urls]
Repository = "https://github.com/Ta0p1/ResolveLab"
Results = "https://github.com/Ta0p1/ResolveLab/blob/main/artifacts/v0.4/RESULTS.md"
Changelog = "https://github.com/Ta0p1/ResolveLab/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/resolvelab"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/examples", "/docs", "/artifacts", "/.github", "/benchmarks",
  "/pyproject.toml", "/README.md", "/README.zh-CN.md", "/CONTRIBUTING.md", "/CITATION.cff",
  "/LICENSE", "/constraints.txt", "/requirements-training.txt", "/.gitignore", "/.gitattributes", "/CHANGELOG.md",
]
exclude = ["/artifacts/browser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
