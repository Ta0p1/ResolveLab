[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "resolvelab"
version = "0.1.0"
description = "An executable support-agent lab with durable tool actions and independent outcome evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
resolvelab = "resolvelab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/resolvelab"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/docs", "/artifacts", "/.github",
  "/pyproject.toml", "/README.md", "/README.zh-CN.md", "/CONTRIBUTING.md",
  "/LICENSE", "/constraints.txt", "/.gitignore", "/.gitattributes",
]
exclude = ["/artifacts/browser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
